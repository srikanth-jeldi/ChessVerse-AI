events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream identity_service { server identity-service:8080; }
  upstream play_service { server play-service:8080; }
  upstream learning_service { server learning-service:8080; }
  upstream economy_service { server economy-service:8080; }
  upstream platform_service { server platform-service:8080; }

  server {
    listen 8080;
    client_max_body_size 12m;

    location /api/auth { proxy_pass http://identity_service; include /etc/nginx/proxy_params; }
    location /api/v1/progress { proxy_pass http://identity_service; include /etc/nginx/proxy_params; }
    location /api/v1/computer-game { proxy_pass http://identity_service; include /etc/nginx/proxy_params; }
    location /api/v1/ai-bot-presets { proxy_pass http://identity_service; include /etc/nginx/proxy_params; }

    location /api/v1/games { proxy_pass http://play_service; include /etc/nginx/proxy_params; }
    location /api/v1/online { proxy_pass http://play_service; include /etc/nginx/proxy_params; }
    location /api/v1/leaderboard { proxy_pass http://play_service; include /etc/nginx/proxy_params; }
    location /api/v1/social { proxy_pass http://play_service; include /etc/nginx/proxy_params; }
    location /api/v1/community { proxy_pass http://play_service; include /etc/nginx/proxy_params; }
    location /api/v1/notifications { proxy_pass http://play_service; include /etc/nginx/proxy_params; }
    location /ws/matches/ {
      proxy_pass http://play_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      include /etc/nginx/proxy_params;
    }

    location /api/v1/engine { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/v1/coach { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/v1/analysis { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }
    location /api/v1/puzzle-sprints { proxy_pass http://learning_service; include /etc/nginx/proxy_params; }

    location /api/v1/economy { proxy_pass http://economy_service; include /etc/nginx/proxy_params; }
    location /api/v1/purchases { proxy_pass http://economy_service; include /etc/nginx/proxy_params; }
    location /api/v1/shop { proxy_pass http://economy_service; include /etc/nginx/proxy_params; }
    location /api/v1/progression { proxy_pass http://economy_service; include /etc/nginx/proxy_params; }

    location /api/contact { proxy_pass http://platform_service; include /etc/nginx/proxy_params; }
    location /api/v1/health { proxy_pass http://platform_service; include /etc/nginx/proxy_params; }
  }
}
