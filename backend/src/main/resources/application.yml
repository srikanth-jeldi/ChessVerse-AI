spring:
  application:
    name: chessverse-ai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chessverse}}
    username: ${DB_USERNAME:chessverse}
    password: ${DB_PASSWORD:chessverse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

chessverse:
  api:
    rate-limit:
      enabled: ${API_RATE_LIMIT_ENABLED:true}
  oauth:
    google-web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
    facebook-app-id: ${FACEBOOK_APP_ID:}
    facebook-app-secret: ${FACEBOOK_APP_SECRET:}
    facebook-graph-version: ${FACEBOOK_GRAPH_VERSION:v26.0}
  engine:
    stockfish-path: ${STOCKFISH_PATH:stockfish}
    response-timeout-seconds: ${STOCKFISH_TIMEOUT_SECONDS:5}
  coach:
    daily-quota: ${AI_COACH_DAILY_QUOTA:30}
    cache-hours: ${AI_COACH_CACHE_HOURS:168}
    language:
      enabled: ${AI_COACH_LLM_ENABLED:false}
      endpoint: ${AI_COACH_LLM_ENDPOINT:https://api.openai.com/v1/chat/completions}
      api-key: ${AI_COACH_LLM_API_KEY:}
      model: ${AI_COACH_LLM_MODEL:gpt-4.1-mini}
      timeout-seconds: ${AI_COACH_LLM_TIMEOUT_SECONDS:8}
      max-output-tokens: ${AI_COACH_LLM_MAX_OUTPUT_TOKENS:220}
  auth:
    otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    session-expiry-days: ${SESSION_EXPIRY_DAYS:30}
    refresh-expiry-days: ${REFRESH_EXPIRY_DAYS:30}
    resend-cooldown-seconds: ${AUTH_RESEND_COOLDOWN_SECONDS:60}
    login-lockout-minutes: ${AUTH_LOGIN_LOCKOUT_MINUTES:15}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    mail-logo-url: ${MAIL_LOGO_URL:https://chessverseai.com/assets/assets/branding/app_icon.png}
  web:
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
