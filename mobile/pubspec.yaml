name: chessverse_ai
description: Cross-platform ChessVerse AI application.
publish_to: "none"
version: 0.1.72+73

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_facebook_auth: ^7.2.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.2.2

  uuid: ^4.5.3
  timezone: ^0.10.1


  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/backgrounds/
    - assets/branding/
    - assets/pieces/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#071B33"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true

flutter_native_splash:
  color: "#02070D"
  image: assets/branding/transparent_splash_icon.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#02070D"
    image: assets/branding/transparent_splash_icon.png
    icon_background_color: "#02070D"
