name: chessverse_ai
description: Cross-platform ChessVerse AI application.
publish_to: "none"
version: 1.2.25+145

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.0
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  firebase_core: ^4.2.1
  firebase_analytics: ^12.5.0
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter

  flutter_facebook_auth: ^7.2.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1

  flutter_secure_storage: ^10.3.1

  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  google_mobile_ads: ^9.1.0
  http: ^1.2.2
  http_parser: ^4.1.2
  in_app_review: ^2.0.12
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3

  uuid: ^4.5.3
  timezone: ^0.10.1


  web_socket_channel: ^3.0.3
  firebase_crashlytics: ^5.3.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/backgrounds/
    - assets/branding/
    - assets/matchmaking/
    - assets/pieces/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#071B33"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#02070D"
    theme_color: "#071B33"

flutter_native_splash:
  color: "#02070D"
  image: assets/branding/transparent_splash_icon.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#02070D"
    image: assets/branding/transparent_splash_icon.png
    icon_background_color: "#02070D"
