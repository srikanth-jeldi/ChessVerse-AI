name: chessverse_ai
description: Cross-platform ChessVerse AI application.
publish_to: "none"
version: 1.2.86+209

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  audioplayers: ^6.8.0
  cupertino_icons: ^1.0.8
  file_picker: ^12.2.0
  firebase_core: ^4.2.1
  firebase_analytics: ^12.5.0
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter

  flutter_facebook_auth: ^7.2.0
  flutter_local_notifications: ^19.5.0
  flutter_tts: ^4.2.5
  flutter_timezone: ^5.1.0

  flutter_secure_storage: ^10.3.1

  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  google_mobile_ads: ^9.1.0
  http: ^1.2.2
  http_parser: ^4.1.2
  in_app_review:
    path: third_party/in_app_review
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3

  uuid: ^4.5.3
  timezone: ^0.10.1


  web_socket_channel: ^3.0.3
  firebase_crashlytics: ^5.3.0
  connectivity_plus: ^7.3.1
  cryptography: ^2.7.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.2

# Gradle-only patches; runtime sources and licenses are retained verbatim.
dependency_overrides:
  firebase_core:
    path: third_party/firebase_core
  firebase_analytics:
    path: third_party/firebase_analytics
  firebase_crashlytics:
    path: third_party/firebase_crashlytics
  flutter_timezone:
    path: third_party/flutter_timezone
  flutter_tts:
    path: third_party/flutter_tts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: ChessVerseSerif
      fonts:
        - asset: assets/fonts/ChessVerseSerif.ttf
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/badges/
    - assets/backgrounds/
    - assets/boards/collection/
    - assets/branding/app_icon.png
    - assets/branding/loading-cinematic-v1.webp
    - assets/branding/chessverse_king_dual_splash.jpg
    - assets/branding/splash_screen_mobile_v2.jpg
    - assets/branding/trophy-dubai-gold-v1.webp
    - assets/branding/trophy-hyderabad-royal-v1.webp
    - assets/branding/trophy-london-classic-v1.webp
    - assets/branding/trophy-new-york-grand-final-v1.webp
    - assets/branding/trophy-tokyo-neon-v1.webp
    - assets/matchmaking/
    - assets/pieces/staunton_black_bishop.png
    - assets/pieces/staunton_black_king.png
    - assets/pieces/staunton_black_knight.png
    - assets/pieces/staunton_black_pawn.png
    - assets/pieces/staunton_black_queen.png
    - assets/pieces/staunton_black_rook.png
    - assets/pieces/staunton_white_bishop.png
    - assets/pieces/staunton_white_king.png
    - assets/pieces/staunton_white_knight.png
    - assets/pieces/staunton_white_pawn.png
    - assets/pieces/staunton_white_queen.png
    - assets/pieces/staunton_white_rook.png
    - assets/pieces/collection/
    - assets/pieces/premium_individual/crimson-crown-3d/white/
    - assets/pieces/premium_individual/crimson-crown-3d/black/
    - assets/pieces/premium_individual/inferno-gold/white/
    - assets/pieces/premium_individual/inferno-gold/black/
    - assets/pieces/premium_individual/ruby-emperor/white/
    - assets/pieces/premium_individual/ruby-emperor/black/
    - assets/pieces/premium_individual/obsidian-regal/white/
    - assets/pieces/premium_individual/obsidian-regal/black/
    - assets/pieces/premium_individual/sapphire-elite/white/
    - assets/pieces/premium_individual/sapphire-elite/black/
    - assets/pieces/premium_individual/emerald-sovereign/white/
    - assets/pieces/premium_individual/emerald-sovereign/black/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#071B33"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#02070D"
    theme_color: "#071B33"

flutter_native_splash:
  color: "#02070D"
  image: assets/branding/transparent_splash_icon.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#02070D"
    image: assets/branding/transparent_splash_icon.png
    icon_background_color: "#02070D"
