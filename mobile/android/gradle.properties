org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Flutter 3.47+ and migrated plugins use AGP 9's built-in Kotlin compiler.
android.builtInKotlin=true
# Plugin sources live in the Pub cache on C: while this workspace is on E:.
# Kotlin incremental cache path relativization cannot span Windows drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
