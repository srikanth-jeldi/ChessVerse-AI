name: Security gates

on:
  workflow_dispatch:
  push:
    branches: [main, 'agent/**', 'codex/**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Immutable commit for trivy-action v0.36.0.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP dependency check
        if: env.NVD_API_KEY != ''
        working-directory: backend
        run: mvn -B org.owasp:dependency-check-maven:12.2.2:check -Dformat=ALL -DfailBuildOnCVSS=7 -DossindexAnalyzerEnabled=false -DnvdApiKey="$NVD_API_KEY"
      - name: Upload OWASP dependency report
        if: ${{ always() && env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: java-kotlin}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - working-directory: backend
        run: mvn -B -DskipTests package
      - uses: github/codeql-action/analyze@v3
