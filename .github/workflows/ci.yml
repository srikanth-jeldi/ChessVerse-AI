name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        run: mvn -B test

  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test mobile
        # Golden pixels are generated on the Windows design baseline; Linux
        # font rasterization differs even when layout and behavior are correct.
        run: flutter test --exclude-tags golden

      - name: Compile Android release bundle
        run: >-
          flutter build appbundle --release
          --dart-define=CHESSVERSE_ENV=production
          --dart-define=API_BASE_URL=https://api.chessverseai.com
          --dart-define=WEB_BASE_URL=https://chessverseai.com
          --dart-define=PRIVACY_POLICY_URL=https://chessverseai.com/privacy
          --dart-define=TERMS_URL=https://chessverseai.com/terms
          --dart-define=DATA_DELETION_URL=https://chessverseai.com/data-deletion

  backend-image:
    name: Backend container image
    runs-on: ubuntu-latest
    needs:
      - backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/srikanth-jeldi/chessverse-ai/backend:${{ github.sha }}
