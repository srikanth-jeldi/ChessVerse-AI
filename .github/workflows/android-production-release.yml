name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Play Store release label
        required: true
        default: production

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Test and build signed AAB
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!value}" || { echo "Missing production secret: ${value}" >&2; exit 1; }
          done

      - name: Configure Android upload signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/chessverse-upload.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../keystore/chessverse-upload.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties android/keystore/chessverse-upload.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # Screenshot goldens are generated on Windows and are intentionally
        # validated in their dedicated visual workflow. Linux font rasterizing
        # differs by a few pixels, so production release CI runs all functional
        # and security tests while excluding only the tagged golden suite.
        run: flutter test --exclude-tags golden

      - name: Build signed production bundle
        run: >-
          flutter build appbundle --release
          --dart-define=CHESSVERSE_ENV=production
          --dart-define=API_BASE_URL=https://api.chessverseai.com
          --dart-define=WEB_BASE_URL=https://chessverseai.com
          --dart-define=PRIVACY_POLICY_URL=https://chessverseai.com/privacy
          --dart-define=TERMS_URL=https://chessverseai.com/terms
          --dart-define=DATA_DELETION_URL=https://chessverseai.com/data-deletion

      - name: Verify signed artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          # Android upload certificates are intentionally self-signed. The
          # jarsigner `-strict` flag rejects that normal Play signing model
          # even when every bundle entry verifies cryptographically. Require
          # jarsigner's positive verification result instead.
          verification="$(jarsigner -verify -certs "$aab" 2>&1)"
          printf '%s\n' "$verification" | grep -q 'jar verified'
          sha256sum "$aab" > "$aab.sha256"

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: chessverse-${{ inputs.release_name }}-${{ github.sha }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
