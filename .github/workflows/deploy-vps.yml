name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Services to deploy
        type: choice
        options: [web, all]
        default: web
      enable_ai_coach:
        description: Enable the conversational AI Coach (requires an existing key in vps.env)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested commit to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Resolve deployment commit
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            deploy_sha="$WORKFLOW_SHA"
          else
            deploy_sha="$MANUAL_SHA"
          fi
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PORT; do
            test -n "${!value}" || {
              echo "Missing GitHub Actions secret: $value" >&2
              exit 1
            }
          done
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/chessverse_vps
          chmod 600 ~/.ssh/chessverse_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_SCOPE: ${{ inputs.scope || 'all' }}
          ENABLE_AI_COACH: ${{ inputs.enable_ai_coach || 'false' }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/chessverse_vps \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$DEPLOY_SCOPE' '$ENABLE_AI_COACH'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          deploy_sha="$1"
          deploy_scope="$2"
          enable_ai_coach="$3"
          [[ "$deploy_scope" == web || "$deploy_scope" == all ]]
          [[ "$enable_ai_coach" == true || "$enable_ai_coach" == false ]]
          repo_dir=/root/ChessVerse-AI
          deploy_dir="$repo_dir/infrastructure/vps"

          cd "$repo_dir"
          test -f "$deploy_dir/vps.env"
          git fetch --quiet origin main
          git cat-file -e "${deploy_sha}^{commit}"
          git checkout --quiet main
          git merge --ff-only "$deploy_sha"

          cd "$deploy_dir"
          if [[ "$enable_ai_coach" == true ]]; then
            ai_key="$(sed -n 's/^AI_COACH_LLM_API_KEY=//p' vps.env | tail -n 1)"
            if [[ -z "$ai_key" || "$ai_key" == replace-* ]]; then
              echo "AI Coach cannot be enabled: AI_COACH_LLM_API_KEY is missing from vps.env." >&2
              exit 1
            fi
            if grep -q '^AI_COACH_LLM_ENABLED=' vps.env; then
              sed -i 's/^AI_COACH_LLM_ENABLED=.*/AI_COACH_LLM_ENABLED=true/' vps.env
            else
              printf '\nAI_COACH_LLM_ENABLED=true\n' >> vps.env
            fi
            echo "AI Coach LLM configuration: enabled=true, key=set"
          fi
          deploy_diagnostics() {
            echo "VPS deployment failed; collecting container state and backend logs."
            docker compose --env-file vps.env -f docker-compose.prod.yml ps || true
            docker compose --env-file vps.env -f docker-compose.prod.yml logs --tail=250 backend || true
          }
          trap deploy_diagnostics ERR
          if [[ "$deploy_scope" == web ]]; then
            web_id="$(docker compose --env-file vps.env -f docker-compose.prod.yml ps -q web)"
            old_image="$(docker inspect --format='{{.Image}}' "$web_id")"
            docker image tag "$old_image" chessverse-web:before-latest-web-release
            docker compose --env-file vps.env -f docker-compose.prod.yml build web
            docker compose --env-file vps.env -f docker-compose.prod.yml up -d --no-deps web
          else
            docker compose --env-file vps.env -f docker-compose.prod.yml up -d --build
          fi
          docker compose --env-file vps.env -f docker-compose.prod.yml ps

          curl --fail --silent --show-error \
            --connect-timeout 10 --retry 12 --retry-delay 5 --retry-all-errors \
            https://api.chessverseai.com/api/v1/health
          curl --fail --silent --show-error \
            --connect-timeout 10 --retry 6 --retry-delay 5 --retry-all-errors \
            https://api.chessverseai.com/actuator/health/readiness
          curl --fail --silent --show-error --head \
            --connect-timeout 10 --retry 6 --retry-delay 5 --retry-all-errors \
            https://chessverseai.com/play/
          REMOTE_SCRIPT

      - name: Deployment summary
        run: |
          echo "### Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ steps.revision.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: https://chessverseai.com/play/" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://api.chessverseai.com/api/v1/health" >> "$GITHUB_STEP_SUMMARY"
